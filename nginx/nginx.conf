server {
    listen 80;
    server_name _;

    # Docker's internal DNS. Re-resolving the service name means a redeployed
    # calculator container (with a new IP) is picked up without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator http://calculator:8081;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    10s;

    location /api/ {
        proxy_pass $calculator;
    }

    location /actuator/health {
        proxy_pass $calculator;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Use /api/v1/... or /actuator/health"}\n';
    }
}
