spring.application.name=calculator

# Port 8080 is used by Jenkins on the host, so the API defaults to 8081.
server.port=${SERVER_PORT:8081}

# Write numbers like 10 instead of 1E+1 in JSON responses.
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose only health and info over HTTP.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
