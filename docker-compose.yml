name: calculator

services:
  calculator:
    image: ${IMAGE_NAME:-kavyag3011/calculator-devops}:${IMAGE_TAG:-dev}
    build: .
    environment:
      SERVER_PORT: "8081"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true
